{% extends "base.html" %}

{% block lab %}Лабораторная работа 8{% endblock %}

{% block main %}
    <h1>Вход в систему</h1>
    
    {% if error %}
        <div style="color: red; margin-bottom: 15px; padding: 10px; background-color: #ffe6e6; border: 1px solid red;">
            {{ error }}
        </div>
    {% endif %}

    <form action="/lab8/login" method="post">
        <div>
            <label>
                Логин: <input type="text" name="login" value="{{ login or '' }}">
            </label>
        </div>

        <div>
            <label>
                Пароль: <input type="password" name="password">
            </label>
        </div>

        <button type="submit">Вход</button>
    </form>
    
    <p>Нет аккаунта? <a href="/lab8/register/">Зарегистрироваться</a></p>
{% endblock %}
