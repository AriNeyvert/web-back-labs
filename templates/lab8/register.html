{% extends "base.html" %}
{% block lab %}Лабораторная работа 8{% endblock %}
{% block main %}
    <h1>Регистрация</h1>
    
    <!-- Вывод сообщений об ошибках -->
    {% if error %}
        <div style="color: red; margin-bottom: 15px; padding: 10px; border: 1px solid red; background-color: #ffe6e6;">
            {{ error }}
        </div>
    {% endif %}
    
    <form action="/lab8/register" method="post">
        <div>
            <label>
                Логин: <input type="text" name="login" value="{{ login or '' }}">
            </label>
        </div>
        <div>
            <label>
                Пароль: <input type="password" name="password">
            </label>
        </div>
        <div>
            <label>
                <input type="checkbox" name="remember">
                Запомнить меня
            </label>
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>
    
    <p>Уже есть аккаунт? <a href="/lab8/login">Войти</a></p>
{% endblock %}
